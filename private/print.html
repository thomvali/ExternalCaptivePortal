<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Print Guest Vouchers</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 25px;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background: #eeeeee;

            color: #111;
        }


        /* ===========================
           TOOLBAR
           =========================== */

        .toolbar {
            max-width: 1000px;

            margin:
                0 auto
                25px;

            background: white;

            padding: 20px;

            border-radius: 12px;

            display: flex;

            align-items: center;
            justify-content: space-between;

            gap: 15px;

            box-shadow:
                0 4px 15px
                rgba(0,0,0,.08);
        }


        .toolbar h1 {
            margin: 0;

            font-size: 22px;
        }


        .toolbar-buttons {
            display: flex;
            gap: 10px;
        }


        button {

            border: none;

            border-radius: 8px;

            padding: 11px 18px;

            font-size: 14px;

            cursor: pointer;

            background: #202124;
            color: white;
        }


        .secondary {
            background: #666;
        }


        /* ===========================
           SHEET
           =========================== */

        .sheet {

            width: 8.5in;

            min-height: 11in;

            margin: auto;

            padding: 0.4in;

            background: white;

            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            grid-auto-rows:
                2.4in;

            gap: 0.15in;

            box-shadow:
                0 6px 30px
                rgba(0,0,0,.15);
        }


        /* ===========================
           VOUCHER CARD
           =========================== */

        .voucher-card {

            border:
                1px dashed
                #666;

            padding: 0.18in;

            position: relative;

            overflow: hidden;

            display: flex;
            flex-direction: column;

            justify-content:
                space-between;

            background: white;
        }


        .card-header {

            display: flex;

            justify-content:
                space-between;

            align-items:
                flex-start;

            gap: 10px;
        }


        .brand {

            font-weight: 700;

            font-size: 17px;
        }


        .label {

            font-size: 10px;

            text-transform:
                uppercase;

            letter-spacing:
                1px;

            color: #666;
        }


        .guest-name {

            margin-top: 8px;

            font-size: 17px;

            font-weight: 600;
        }


        .code-area {

            text-align: center;

            margin:
                10px 0;
        }


        .code-label {

            font-size: 10px;

            text-transform:
                uppercase;

            letter-spacing:
                1px;

            color: #555;
        }


        .code {

            font-family:
                "SFMono-Regular",
                Consolas,
                monospace;

            font-weight: 800;

            font-size: 28px;

            letter-spacing: 3px;

            margin-top: 4px;
        }


        .details {

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 8px;

            font-size: 11px;
        }


        .details strong {

            display: block;

            font-size: 12px;

            margin-top: 2px;
        }


        .instructions {

            margin-top: 8px;

            padding-top: 8px;

            border-top:
                1px solid
                #ddd;

            font-size: 10px;

            line-height: 1.35;
        }


        .one-time {

            position: absolute;

            top: 10px;
            right: 10px;

            border:
                1px solid
                #111;

            padding:
                3px 6px;

            font-size: 9px;

            font-weight: bold;

            text-transform:
                uppercase;
        }


        .empty {

            max-width: 600px;

            margin:
                50px auto;

            background: white;

            padding: 30px;

            border-radius: 12px;

            text-align: center;
        }


        /* ===========================
           PRINT
           =========================== */

        @page {

            size:
                Letter portrait;

            margin: 0;
        }


        @media print {

            body {
                padding: 0;
                margin: 0;

                background: white;
            }


            .toolbar {
                display: none;
            }


            .sheet {

                width: 8.5in;

                min-height: 11in;

                margin: 0;

                box-shadow: none;

                page-break-after:
                    always;
            }


            .sheet:last-child {

                page-break-after:
                    auto;
            }


            .voucher-card {

                break-inside:
                    avoid;
            }

        }

    </style>

</head>


<body>


<div class="toolbar">

    <div>

        <h1>Printable Guest Vouchers</h1>

        <div id="summary"></div>

    </div>


    <div class="toolbar-buttons">

        <button
            class="secondary"
            onclick="window.location.href='/admin'"
        >
            Back
        </button>

        <button
            onclick="window.print()"
        >
            Print
        </button>

    </div>

</div>


<div id="output"></div>


<script>

const params =
    new URLSearchParams(
        window.location.search
    );


async function loadVouchers() {

    const response =
        await fetch(
            "/api/admin/vouchers"
        );


    if (!response.ok) {

        document.getElementById(
            "output"
        ).innerHTML = `

            <div class="empty">

                Unable to load vouchers.

            </div>
        `;

        return;
    }


    let vouchers =
        await response.json();


    /*
        Supported URLs:

        /admin/print
            = all currently unused vouchers

        /admin/print?id=12
            = one voucher

        /admin/print?ids=12,13,14
            = multiple vouchers
    */


    const singleId =
        params.get("id");


    const ids =
        params.get("ids");


    if (singleId) {

        vouchers =
            vouchers.filter(
                voucher =>
                    String(voucher.id)
                    === String(singleId)
            );

    }

    else if (ids) {

        const selected =
            ids
                .split(",")
                .map(String);


        vouchers =
            vouchers.filter(
                voucher =>
                    selected.includes(
                        String(
                            voucher.id
                        )
                    )
            );

    }

    else {

        // Default behavior:
        // only vouchers that have
        // not yet been used or expired.

        vouchers =
            vouchers.filter(
                voucher => {

                    const expired =
                        new Date(
                            voucher.expires_at
                        ).getTime()
                        <= Date.now();


                    return (
                        !voucher.used_at &&
                        !voucher.revoked_at &&
                        !expired
                    );
                }
            );
    }


    document.getElementById(
        "summary"
    ).textContent =
        `${vouchers.length} voucher${
            vouchers.length === 1
                ? ""
                : "s"
        } ready to print`;


    renderVouchers(
        vouchers
    );
}



function renderVouchers(
    vouchers
) {

    const output =
        document.getElementById(
            "output"
        );


    output.innerHTML = "";


    if (
        vouchers.length === 0
    ) {

        output.innerHTML = `

            <div class="empty">

                <h2>No vouchers to print</h2>

                <p>
                    Create an unused voucher
                    from the admin page first.
                </p>

            </div>
        `;

        return;
    }


    /*
        8 cards per sheet
    */

    for (
        let i = 0;
        i < vouchers.length;
        i += 8
    ) {

        const sheet =
            document.createElement(
                "div"
            );


        sheet.className =
            "sheet";


        const group =
            vouchers.slice(
                i,
                i + 8
            );


        for (
            const voucher
            of group
        ) {

            sheet.appendChild(
                createVoucherCard(
                    voucher
                )
            );
        }


        output.appendChild(
            sheet
        );
    }
}



function createVoucherCard(
    voucher
) {

    const card =
        document.createElement(
            "div"
        );


    card.className =
        "voucher-card";


    const expiration =
        new Date(
            voucher.expires_at
        );


    const expirationText =
        expiration.toLocaleString(
            [],
            {
                month:
                    "short",

                day:
                    "numeric",

                year:
                    "numeric",

                hour:
                    "numeric",

                minute:
                    "2-digit"
            }
        );


    card.innerHTML = `

        <div class="one-time">
            One-Time Use
        </div>


        <div>

            <div class="card-header">

                <div>

                    <div class="label">
                        Guest Internet Access
                    </div>

                    <div class="brand">
                        Guest WiFi
                    </div>

                </div>

            </div>


            <div class="guest-name">
            </div>


            <div class="code-area">

                <div class="code-label">
                    Voucher Code
                </div>

                <div class="code">
                </div>

            </div>

        </div>


        <div>

            <div class="details">

                <div>

                    <span class="label">
                        Guest
                    </span>

                    <strong
                        class="detail-name"
                    ></strong>

                </div>


                <div>

                    <span class="label">
                        Valid Until
                    </span>

                    <strong
                        class="detail-expiration"
                    ></strong>

                </div>

            </div>


            <div class="instructions">

                Join the
                <strong>
                    Guest WiFi
                </strong>
                network and enter the voucher
                code when prompted.

                This voucher may only be
                redeemed once.

            </div>

        </div>
    `;


    card.querySelector(
        ".guest-name"
    ).textContent =
        `Welcome, ${voucher.full_name}`;


    card.querySelector(
        ".code"
    ).textContent =
        voucher.code;


    card.querySelector(
        ".detail-name"
    ).textContent =
        voucher.full_name;


    card.querySelector(
        ".detail-expiration"
    ).textContent =
        expirationText;


    return card;
}



loadVouchers();

</script>


</body>

</html>
