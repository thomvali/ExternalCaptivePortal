<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Guest Voucher Administration</title>

    <style>
        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            margin: 0;
            padding: 40px;

            background: #f4f5f7;
            color: #202124;
        }

        .container {
            max-width: 1000px;
            margin: auto;
        }

        .card {
            background: white;

            padding: 30px;

            border-radius: 14px;

            margin-bottom: 30px;

            box-shadow:
                0 5px 20px rgba(0, 0, 0, .08);
        }

        input {
            width: 100%;
            padding: 12px;

            margin-top: 5px;
            margin-bottom: 20px;

            box-sizing: border-box;

            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            padding: 12px 20px;

            border: none;
            border-radius: 8px;

            background: #202124;
            color: white;

            cursor: pointer;
        }

        table {
            width: 100%;

            border-collapse:
                collapse;
        }

        th,
        td {
            padding: 12px;

            text-align: left;

            border-bottom:
                1px solid #eee;
        }

        .voucher {
            font-family:
                monospace;

            font-size: 16px;

            font-weight: bold;
        }

        .active {
            color: green;
        }

        .used {
            color: #a15c00;
        }

        .expired {
            color: red;
        }

        #createdVoucher {
            font-size: 28px;

            font-family:
                monospace;

            font-weight: bold;

            margin-top: 20px;
        }

        .actions {
            display: flex;
            gap: 8px;
        }

        .action-button {
            padding: 8px 12px;
            font-size: 13px;
        }

        .revoke-button {
            background: #b26a00;
        }

        .delete-button {
            background: #b42318;
        }

        .action-button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .revoked {
            color: #b42318;
            font-weight: 600;
        }
    </style>

</head>


<body>

    <div class="container">

        <h1>Guest Voucher Administration</h1>

        <button onclick="window.open('/admin/print', '_blank')">
            Print All Unused Vouchers
        </button>

        <div class="card">

            <h2>Create Voucher</h2>

            <form id="voucherForm">

                <label>
                    Guest Full Name
                </label>

                <input id="fullName" type="text" placeholder="John Smith" required>


                <label>
                    Access Expiration
                </label>

                <input id="expiresAt" type="datetime-local" required>


                <button type="submit">
                    Generate Voucher
                </button>

            </form>


            <div id="createdVoucher"></div>

            <div id="createdName"></div>

        </div>


        <div class="card">

            <h2>Vouchers</h2>

            <table>

                <thead>

                    <tr>
                        <th>Code</th>
                        <th>Name</th>
                        <th>Expires</th>
                        <th>Status</th>
                        <th>Device</th>
                        <th>Actions</th>
                    </tr>

                </thead>

                <tbody id="voucherList"></tbody>

            </table>

        </div>

    </div>


    <script>

        const form =
            document.getElementById(
                "voucherForm"
            );


        form.addEventListener(
            "submit",

            async event => {

                event.preventDefault();

                const fullName =
                    document.getElementById(
                        "fullName"
                    ).value;

                const localExpiration =
                    document.getElementById(
                        "expiresAt"
                    ).value;


                const expiration =
                    new Date(
                        localExpiration
                    );


                const response =
                    await fetch(
                        "/api/admin/vouchers",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify({
                                    fullName,

                                    expiresAt:
                                        expiration
                                            .toISOString()
                                })
                        }
                    );


                const result =
                    await response.json();


                if (!response.ok) {

                    alert(
                        result.error ||
                        "Unable to create voucher."
                    );

                    return;
                }


                document.getElementById(
                    "createdVoucher"
                ).textContent =
                    result.code;


                document.getElementById(
                    "createdName"
                ).textContent =
                    `Created for ${result.fullName}`;


                form.reset();

                loadVouchers();
            }
        );


        async function loadVouchers() {

            const response =
                await fetch(
                    "/api/admin/vouchers"
                );


            if (!response.ok) {
                return;
            }


            const vouchers =
                await response.json();


            const tbody =
                document.getElementById(
                    "voucherList"
                );


            tbody.innerHTML = "";


            for (const voucher of vouchers) {

                const row =
                    document.createElement(
                        "tr"
                    );


                let status;
                let statusClass;


                const expired =
                    new Date(
                        voucher.expires_at
                    ).getTime()
                    <= Date.now();


                if (voucher.revoked_at) {

                    status = "Revoked";
                    statusClass = "revoked";

                }

                else if (expired) {

                    status = "Expired";
                    statusClass = "expired";

                }

                else if (voucher.used_at) {

                    status = "Active";
                    statusClass = "active";

                }

                else {

                    status = "Unused";
                    statusClass = "used";

                }


                const code =
                    document.createElement(
                        "td"
                    );

                code.className =
                    "voucher";

                code.textContent =
                    voucher.code;


                const name =
                    document.createElement(
                        "td"
                    );

                name.textContent =
                    voucher.full_name;


                const expiration =
                    document.createElement(
                        "td"
                    );

                expiration.textContent =
                    new Date(
                        voucher.expires_at
                    ).toLocaleString();


                const statusCell =
                    document.createElement(
                        "td"
                    );

                statusCell.className =
                    statusClass;

                statusCell.textContent =
                    status;


                const device =
                    document.createElement(
                        "td"
                    );

                device.textContent =
                    voucher.used_by_mac || "—";

                const actions =
                    document.createElement(
                        "td"
                    );

                actions.className =
                    "actions";


                // ============================
                // REVOKE BUTTON
                // ============================

                const revokeButton =
                    document.createElement(
                        "button"
                    );

                revokeButton.textContent =
                    "Revoke";

                revokeButton.className =
                    "action-button revoke-button";


                const canRevoke =
                    voucher.used_at &&
                    !voucher.revoked_at &&
                    !expired;


                revokeButton.disabled =
                    !canRevoke;


                revokeButton.addEventListener(
                    "click",

                    () => {

                        revokeVoucher(
                            voucher.id,
                            voucher.code,
                            voucher.full_name
                        );
                    }
                );


                // ============================
                // DELETE BUTTON
                // ============================

                const deleteButton =
                    document.createElement(
                        "button"
                    );

                deleteButton.textContent =
                    "Delete";

                deleteButton.className =
                    "action-button delete-button";


                deleteButton.addEventListener(
                    "click",

                    () => {

                        deleteVoucher(
                            voucher.id,
                            voucher.code,
                            voucher.full_name
                        );
                    }
                );

                const printButton =
                    document.createElement(
                        "button"
                    );

                printButton.textContent =
                    "Print";

                printButton.className =
                    "action-button";


                printButton.addEventListener(
                    "click",

                    () => {

                        window.open(
                            `/admin/print?id=${voucher.id}`,
                            "_blank"
                        );
                    }
                );


                actions.append(
                    revokeButton,
                    deleteButton,
                    printButton
                );

                row.append(
                    code,
                    name,
                    expiration,
                    statusCell,
                    device,
                    actions
                );


                tbody.appendChild(row);
            }
        }

        async function revokeVoucher(
            id,
            code,
            fullName
        ) {

            const confirmed =
                confirm(
                    `Revoke guest access?\n\n` +
                    `${fullName}\n` +
                    `${code}\n\n` +
                    `Their Internet access will be removed immediately.`
                );


            if (!confirmed) {
                return;
            }


            try {

                const response =
                    await fetch(
                        `/api/admin/vouchers/${id}/revoke`,
                        {
                            method: "POST"
                        }
                    );


                const result =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        result.error ||
                        "Unable to revoke voucher."
                    );
                }


                alert(
                    `Access revoked for ${fullName}.`
                );


                await loadVouchers();

            }

            catch (error) {

                alert(
                    error.message
                );
            }
        }



        async function deleteVoucher(
            id,
            code,
            fullName
        ) {

            const confirmed =
                confirm(
                    `Permanently delete this voucher?\n\n` +
                    `${fullName}\n` +
                    `${code}\n\n` +
                    `This cannot be undone.`
                );


            if (!confirmed) {
                return;
            }


            try {

                const response =
                    await fetch(
                        `/api/admin/vouchers/${id}`,
                        {
                            method: "DELETE"
                        }
                    );


                const result =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        result.error ||
                        "Unable to delete voucher."
                    );
                }


                await loadVouchers();

            }

            catch (error) {

                alert(
                    error.message
                );
            }
        }

        loadVouchers();

    </script>

</body>

</html>
