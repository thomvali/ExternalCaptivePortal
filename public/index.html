<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">

        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Guest WiFi</title>

        <link rel="stylesheet" href="/style.css">
    </head>

    <body>
        <div class="portal">
            <h1>Welcome</h1>

            <p class="subtitle">
                Connect to our complimentary guest WiFi.
            </p>

            <div class="network-info">
                <span>Network</span>
                <strong id="ssid">Guest WiFi</strong>
            </div>

            <p class="terms">
                By connecting to this network, you agree to use the Internet responsibly and accept our guest network terms of service.
            </p>

            <button id="connectButton">
                Accept & Continue
            </button>

            <p id="status"></p>
        </div>

        <script>
            const params = new URLSearchParams(window.location.search)

            const mac = params.get("id");
            const ssid = params.get("ssid");
            const returnUrl = params.get("url");

            const button = document.getElementById("connectButton")
            const status = document.getElementById("status");

            if (ssid) {
                document.getElementById("ssid").textContent = ssid;
            }

            if (!mac) {
                status.textContent = "Unable to identify this device.";

                button.disabled = true;
            }

            button.addEventListener("click", async () => {
                button.disabled = true;

                button.textContent = "Connecting...";

                status.textContent = "";

                try {
                    const response = await fetch("/authorize", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            mac: mac,
                            returnUrl: returnUrl
                        })
                    });

                    const result = await response.json();

                    if (!response.ok) {
                        throw new Error(result.error || "Authorization failed.");
                    }

                    button.textContent = "Connected ✓";
                    status.textContent = "You're connected to the Internet.";

                    if (result.redirect) {
                        setTimeout(() => {
                            window.location.href = result.redirect;
                        }, 1000);
                    }
                } catch (error) {
                    console.error(error);

                    status.textContent = error.message;
                    button.disabled = false;
                    button.textContent = "Try Again";
                }
            });
        </script>
    </body>
</html>
